# ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r   (prefix is Ctrl+Space)

# ---------------------------------------------------------------- basics
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix         # prefix twice sends a real Ctrl+Space (e.g. LazyVim's treesitter select)
set -g mouse on                  # wheel scrolling + drag-to-select (copies on release)
set -g history-limit 50000       # scrollback lines per pane
set -g base-index 1              # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on       # close window 2 of 3 -> 3 becomes 2
set -g set-clipboard on          # copy-mode selections reach the system clipboard (OSC 52)
setw -g mode-keys vi             # copy mode (prefix + [) uses vim motions

# Automatic window names: shells show their directory ("hw3"), programs show
# program:directory ("nvim:hw3", "claude:hw3"), ssh just shows "ssh" (tmux can't
# see the remote host). Renaming a window by hand (prefix + ,) pins that name.
setw -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{?#{==:#{pane_current_command},ssh},ssh,#{pane_current_command}:#{b:pane_current_path}}}"

# ---------------------------------------------------------------- neovim
# These silence the tmux warnings in nvim's :checkhealth
set -sg escape-time 10           # default delay makes Esc feel laggy in nvim
set -g focus-events on           # lets LazyVim reload files edited outside it (e.g. by Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true color for themes

# ---------------------------------------------------------------- claude code
# From https://code.claude.com/docs/en/terminal-config
set -g allow-passthrough on      # notifications / progress reach Ptyxis
set -s extended-keys on          # Shift+Enter inserts a newline instead of submitting
set -as terminal-features "xterm*:extkeys"

# ---------------------------------------------------------------- keys
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy mode: v to start selecting, y to copy (like nvim).
# Piped to wl-copy so it works even if the terminal ignores OSC 52.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ---------------------------------------------------------------- theme
# Catppuccin Mocha, peach accent (matches the Ptyxis palette)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_text " #W"            # show window names, not pane titles
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_peach}}"   # red while prefix is held

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Active pane: a solid peach title bar along its top edge, plus a normal
# background while inactive panes are dimmed: darkest "crust" shade + gray text.
# (mantle alone was too close to the normal background to notice.)
# (Apps that paint their own background, like nvim, won't dim — the title bar still shows it.)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_crust} bg=#{@thm_peach} bold],#[fg=#{@thm_overlay_1} bg=#{@thm_surface_0}]} #{pane_index}  #{pane_current_command}  #{b:pane_current_path} #[default]"
set -g pane-border-indicators off       # drop the half-coloured divider
set -gF pane-active-border-style "fg=#{@thm_surface_1}"
set -gF pane-border-style "fg=#{@thm_surface_1}"
set -gF window-style "bg=#{@thm_crust},fg=#{@thm_overlay_1}"
# Must be explicit colours: "default" here means "inherit window-style", which dims everything.
set -gF window-active-style "bg=#{@thm_bg},fg=#{@thm_fg}"

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ---------------------------------------------------------------- plugins
# Ctrl+h/j/k/l moves between nvim splits and tmux panes seamlessly.
# Ctrl+l no longer clears the shell; use prefix + Ctrl+l instead.
run ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux

# Session persistence. Saves every 15 min and restores when tmux starts.
# Manual: prefix + Ctrl+s to save, prefix + Ctrl+r to restore.
set -g @resurrect-capture-pane-contents "on"   # bring back on-screen output too
# Programs to relaunch on restore (nvim/vim/less/htop/... are restored by default).
# ssh reconnects with the same arguments; Claude Code resumes its last conversation in that directory.
set -g @resurrect-processes 'ssh "~^[^ ]*claude->claude --continue"'
set -g @continuum-restore "on"
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
# Must stay last: continuum hooks into status-right, which the theme section overwrites.
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
